# Review-only isolated Blueprint. Never use render.yaml for staging.
# No database or Redis resource is created. DATABASE_URL and REDIS_URL are
# separately supplied, staging-only secrets. OAuth credentials remain absent.
projects:
  - name: Vervfy OAuth Staging
    environments:
      - name: Staging
        services:
          - type: web
            name: vervfy-staging-api
            region: virginia
            runtime: python
            plan: free
            rootDir: release-artifacts/vervfy-staging-upstash-rediss-rc/source
            buildCommand: pip install --require-hashes -r requirements.lock
            startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --no-access-log --lifespan on --workers 1
            healthCheckPath: /healthz
            autoDeploy: false
            envVars:
              - key: PYTHON_VERSION
                value: 3.12.7
              - key: VERVFY_ENVIRONMENT
                value: staging
              - key: VERVFY_HTTPS_ONLY
                value: "1"
              - key: VERVFY_COOKIE_SAME_SITE
                value: lax
              - key: VERVFY_TRUSTED_PROXY_HOPS
                value: "1"
              - key: VERVFY_SECRET_KEY
                generateValue: true
              - key: VERVFY_ASYNC_UPLOADS
                value: "0"
              - key: PGSSLROOTCERT
                value: /etc/secrets/prod-ca-2021.crt
              # The read-only staging preflight failed at application_permissions.
              # Do not deploy or connect until the DB owner resolves that blocker.
              - key: DATABASE_URL
                sync: false
              - key: VERVFY_STAGING_REDIS_HOST
                # Non-secret endpoint allowlist; must match the Upstash URL host.
                sync: false
              - key: REDIS_URL
                # Set only to the existing isolated Upstash rediss:// URL as
                # a staging API secret; never put the credential in this file.
                sync: false
              - key: GOOGLE_OAUTH_ENABLED
                value: "0"
              # Add Google credentials and the restricted lookup URL only after
              # staging DB permissions and OAuth prerequisites are separately verified.

          - type: web
            name: vervfy-staging-web
            region: virginia
            runtime: node
            plan: free
            rootDir: release-artifacts/vervfy-staging-upstash-rediss-rc/source/web
            buildCommand: npm ci && npm run build
            startCommand: npm run start
            healthCheckPath: /manifest.webmanifest
            autoDeploy: false
            envVars:
              - key: NODE_VERSION
                value: "22"
              - key: VERVFY_ENVIRONMENT
                value: staging
              - key: BACKEND_URL
                value: https://vervfy-staging-api.onrender.com
              - key: SITE_URL
                value: https://vervfy-staging-web.onrender.com
