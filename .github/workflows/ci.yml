name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==8.4.2
      - run: python -m unittest discover -s tests -v
        env:
          DATABASE_URL: "sqlite:///:memory:"

  storage-acl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Run isolated PostgreSQL storage migration and ACL regressions
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          python -m unittest discover -s tests -p 'test_staging_migrations.py' -v
          python -m unittest discover -s tests -p 'test_storage_acl_inventory.py' -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          SITE_URL: http://127.0.0.1:3100
          VERVFY_ENVIRONMENT: test
          BACKEND_URL: http://127.0.0.1:8100
      - run: npx playwright install --with-deps chromium
      - name: Reproduce the 14 Playwright failures against main
        run: >-
          npx playwright test
          tests/button-motion.spec.ts
          tests/interaction-polish.spec.ts
          tests/palette.spec.ts
          tests/seo.spec.ts
          tests/smoke.spec.ts
          --grep 'buttons ease into|dragging a sheet header dismisses|upward drags resist|Space opens playlist form|monthly listening record appears once|shared palette, contrast and responsive pages|language switching preserves consistent homepage metadata|public routes have useful metadata|expanded mobile player shows playback-synced lyric lines|listening recap visualizes recorded play counts|opening the library with an expired session|liquid glass stays translucent|mock-backend login, upload|authenticated views share the palette'
      - run: npm run test:e2e
