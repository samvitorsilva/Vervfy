<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0e14">
<title>Verify email — Vervfy</title>
<link rel="icon" type="image/svg+xml" href="/static/gemini-svg.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css?v=30">
<link rel="stylesheet" href="/static/auth.css?v=3">
</head>
<body>
<div class="field" aria-hidden="true">
  <div class="field-blob field-blob-a"></div>
  <div class="field-blob field-blob-b"></div>
</div>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><img src="/static/gemini-svg.svg" alt="" width="28" height="28">Vervfy</div>
    {% if success %}
    <div class="auth-title">Email verified</div>
    <div class="auth-notice" role="status">Your email address is verified and can be used to reset your password.</div>
    {% elif error %}
    <div class="auth-title">Email not verified</div>
    <div class="auth-error" role="alert">{{ error }}</div>
    {% else %}
    <div class="auth-title">Confirm your email address</div>
    <div class="auth-sub">Confirm this address for your Vervfy account.</div>
    <form method="post" action="/verify-email">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="token" value="{{ token }}">
      <button class="auth-submit" type="submit">Verify email address</button>
    </form>
    {% endif %}
    <div class="auth-footer"><a href="/login">Back to Vervfy</a></div>
  </div>
</div>
</body>
</html>
