<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0e14">
<title>Reset password — Vervfy</title>
<link rel="icon" type="image/svg+xml" href="/static/gemini-svg.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css?v=30">
<link rel="stylesheet" href="/static/auth.css?v=3">
</head>
<body>
<div class="field" aria-hidden="true">
  <div class="field-blob field-blob-a"></div>
  <div class="field-blob field-blob-b"></div>
</div>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand"><img src="/static/gemini-svg.svg" alt="" width="28" height="28">Vervfy</div>
    <div class="auth-title">Reset your password</div>
    <div class="auth-sub">Enter the verified email address on your account. If it matches, we’ll send a reset link.</div>
    {% if sent %}
    <div class="auth-notice" role="status">If that address belongs to an account with a verified email, a reset link is on its way.</div>
    {% else %}
    <form method="post" action="/forgot-password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="auth-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="320" required autofocus>
      </div>
      <button class="auth-submit" type="submit">Send reset link</button>
    </form>
    {% endif %}
    <div class="auth-footer"><a href="/login">Back to log in</a></div>
  </div>
</div>
</body>
</html>
