<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0e14" />
    <title>Vervfy · Offline</title>
    <link rel="icon" href="/gemini-svg.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0c0e14; color: #f2f3f7; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 20% 10%, rgba(80,72,130,.24), transparent 55%), linear-gradient(145deg, #11131d, #080a10 68%); }
      main { width: min(100%, 420px); padding: 36px; text-align: center; border: 1px solid rgba(255,255,255,.12); border-radius: 28px; background: rgba(255,255,255,.06); box-shadow: 0 14px 38px rgba(0,0,0,.28); backdrop-filter: blur(18px); }
      img { width: 60px; height: 60px; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0; color: #a5a8b7; line-height: 1.6; }
      button { margin-top: 24px; padding: 10px 18px; color: #f2f3f7; font: inherit; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; background: rgba(255,255,255,.08); cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/gemini-svg.svg" alt="" />
      <h1>You’re offline</h1>
      <p>The Vervfy app shell is available, but your account, library, and audio need an internet connection.</p>
      <form action="/" method="get"><button type="submit">Try again</button></form>
    </main>
  </body>
</html>
