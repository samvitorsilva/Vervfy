services:
  - type: keyvalue
    name: vervfy-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: vervfy-api
    runtime: python
    plan: free
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VERVFY_ENVIRONMENT
        value: production
      - key: VERVFY_HTTPS_ONLY
        value: "1"
      - key: VERVFY_COOKIE_SAME_SITE
        value: lax
      - key: VERVFY_TRUSTED_PROXY_HOPS
        value: "1"
      - key: VERVFY_SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vervfy-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: songs
      - key: GOOGLE_OAUTH_ENABLED
        value: "0"
      - key: VERVFY_WEBAUTHN_ENABLED
        value: "0"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_IDENTITY_LOOKUP_DATABASE_URL
        sync: false

  - type: web
    name: vervfy-next
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /manifest.webmanifest
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BACKEND_URL
        sync: false
